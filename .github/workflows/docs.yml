name: docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress off: let an in-flight production deploy finish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # enablement: turns Pages on (source: GitHub Actions) on first run,
      # so the deploy job doesn't 404 before Settings -> Pages was visited.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: pip install mkdocs-terok mkdocs-material "mkdocstrings[python]" mkdocs-literate-nav
      - run: properdocs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
