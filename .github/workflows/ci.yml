name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the camera venv; bump together with it.
          python-version: "3.11"
      # Pins match the venv. depthai-nodes pulls depthai + opencv-headless +
      # numpy; no camera is needed -- the suite tests the wire contract, the
      # letterbox maths and the interactive config, all host-side.
      - run: pip install depthai==3.8.0 depthai-nodes==0.6.0 pytest "ruff~=0.16.0" mypy
      - run: ruff check .
      - run: mypy
      - run: pytest

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Major version tracks the REUSE helper tool's major (v6 = reuse 6.x,
      # same line as the local venv install).
      - uses: fsfe/reuse-action@v6
