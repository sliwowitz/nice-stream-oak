# Not a distributable package -- this file centralizes project metadata and
# tool configuration for the nice-stream-oak scripts.
[project]
name = "nice-stream-oak"
version = "0.1.0"
description = "OAK-4 depth/rgb/pose to shared memory for the Nice-Stream installation"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSES/*.txt"]

# The runtime venv is provisioned by hand (depthai wheels); these groups
# cover the tooling on top of it.
[dependency-groups]
dev = [
    "pytest>=8",
    "reuse>=5",
    "ruff~=0.16.0",
    "mypy>=1.14",
]
docs = [
    # Needs Python >= 3.12; built in CI (.github/workflows/docs.yml), not
    # in the camera venv.
    "mkdocs-terok~=0.8.0",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=0.26",
    "mkdocs-literate-nav>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
extend-exclude = ["scratch", "depth_server.py"]   # dev scripts / superseded

[tool.ruff.lint]
# Deliberately no BLE: the servers' top-level `except Exception` loops are
# the unattended-for-weeks resilience strategy, not an accident.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
files = ["nsk.py", "stream_server.py", "pose_server.py", "osc_bridge.py",
         "calib_capture.py"]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# depthai_nodes ships no py.typed; rtmlib/onnxruntime live only in the
# GPU-enabled install.
module = ["depthai_nodes.*", "rtmlib.*", "onnxruntime.*"]
ignore_missing_imports = true
